<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalogue</title>
<style>:root{--bg:#090a09;--p:#121411;--ln:#272c26;--g:#14b865;--up:#2dff8a;--tx:#f1f1ec;--mu:#8f968d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:0 16px 40px}
header{padding:22px 0 10px}h1{margin:0;font-size:1.5rem;letter-spacing:.02em}.mu{color:var(--mu);font-size:.85rem}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--ln);background:var(--p);color:var(--tx);font-size:1rem;margin:10px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--ln);background:var(--p);color:var(--tx);font-size:.85rem}.chip.on{background:var(--g);border-color:var(--g);color:#001b0c;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.it{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.nm{font-weight:700}.pr{color:var(--up);font-weight:800;font-size:1.1rem}.bd{font-size:.72rem;padding:2px 8px;border-radius:999px;align-self:flex-start}.ok{background:#0c3d24;color:var(--up)}.no{background:#2b2b2b;color:var(--mu)}
a.b{margin-top:auto;text-align:center;text-decoration:none;background:var(--g);color:#001b0c;font-weight:800;padding:10px;border-radius:10px;font-size:.9rem}a.b.off{pointer-events:none;opacity:.4}
.msg{text-align:center;padding:60px 0;color:var(--mu)}footer{text-align:center;margin-top:28px;color:var(--mu);font-size:.72rem;letter-spacing:.12em}</style></head><body>
<header><h1 id="nm">…</h1><div class="mu" id="up"></div></header>
<input id="q" type="search" placeholder="" autocomplete="off"><div class="chips" id="chips"></div><div class="grid" id="grid"></div><div class="msg" id="msg"></div>
<footer>PROPULSÉ PAR KINSHASA BRUTE</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var L={fr:{s:'Rechercher un article',all:'Tout',ok:'Disponible',no:'Rupture',o:'Commander',up:'Mis à jour',nf:'Catalogue introuvable ou indisponible.',hi:'Bonjour, je voudrais commander : '},en:{s:'Search items',all:'All',ok:'Available',no:'Out of stock',o:'Order',up:'Updated',nf:'Catalogue not found or unavailable.',hi:'Hello, I would like to order: '},es:{s:'Buscar artículo',all:'Todo',ok:'Disponible',no:'Agotado',o:'Pedir',up:'Actualizado',nf:'Catálogo no encontrado o no disponible.',hi:'Hola, quisiera pedir: '},pt:{s:'Procurar artigo',all:'Tudo',ok:'Disponível',no:'Esgotado',o:'Encomendar',up:'Atualizado',nf:'Catálogo não encontrado ou indisponível.',hi:'Olá, gostaria de encomendar: '}};
var lg=(navigator.language||'fr').slice(0,2);var T=L[lg]||L.fr;var D=null,cat='';
var $=function(i){return document.getElementById(i)};function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){var s=(Math.round(n*100)/100).toLocaleString(lg);return D.cu==='$'?'$'+s:s+' '+(D.cu||'FC')}
function wa(p){p=String(p||'').replace(/\D/g,'');if(p.charAt(0)==='0')p='243'+p.slice(1);return p}
function draw(){var q=$('q').value.trim().toLowerCase(),cs={};D.it.forEach(function(x){if(x.c)cs[x.c]=1});
 $('chips').innerHTML=['']
  .concat(Object.keys(cs)).map(function(c){return'<button class="chip'+(c===cat?' on':'')+'" data-c="'+esc(c)+'">'+esc(c||T.all)+'</button>'}).join('');
 var l=D.it.filter(function(x){return(!cat||x.c===cat)&&(!q||x.n.toLowerCase().indexOf(q)>-1)});
 $('grid').innerHTML=l.map(function(x){var u=D.ph?'https://wa.me/'+wa(D.ph)+'?text='+encodeURIComponent(T.hi+x.n+' ('+money(x.p)+')'):'#';return'<div class="it"><div class="nm">'+esc(x.n)+'</div><div class="pr">'+esc(money(x.p))+(x.u?' <span class="mu">/ '+esc(x.u)+'</span>':'')+'</div><span class="bd '+(x.s?'ok':'no')+'">'+(x.s?T.ok:T.no)+'</span><a class="b'+(x.s&&D.ph?'':' off')+'" href="'+u+'" target="_blank" rel="noopener">'+T.o+'</a></div>'}).join('')}
document.addEventListener('click',function(e){var b=e.target.closest('.chip');if(b){cat=b.getAttribute('data-c');draw()}});$('q').addEventListener('input',draw);$('q').placeholder=T.s;
(async function(){var c=new URLSearchParams(location.search).get('c');if(!c){$('msg').textContent=T.nf;return}
 try{var sb=window.supabase.createClient('https://cjrgqnbqeslrcdluasll.supabase.co','sb_publishable_yGbdvEskKhhbaqr2Iz1nKA_VgIZcGMz');var r=await sb.rpc('get_catalog',{sl:c});if(r.error||!r.data)throw 0;D=r.data;
  $('nm').textContent=D.n||'';document.title=D.n||'Catalogue';$('up').textContent=T.up+' '+new Date(D.at).toLocaleDateString(lg);draw()}catch(e){$('nm').textContent='';$('msg').textContent=T.nf}})();
</script></body></html>
